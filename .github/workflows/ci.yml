name: Zigmacs CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf \
          automake \
          texinfo \
          libgnutls28-dev \
          libxml2-dev \
          libtree-sitter-dev \
          build-essential \
          pkg-config \
          libncurses-dev

    - name: Install Zig 0.17.0
      run: |
        # Download Zig 0.17.0 for Linux x86_64
        # NOTE: Zig 0.17.0 uses arch-first naming (zig-x86_64-linux-VER)
        wget -q https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz

        # Verify checksum (SHA256 from https://ziglang.org/download/)
        echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  zig-x86_64-linux-0.17.0.tar.xz" | sha256sum --check

        # Extract
        tar -xf zig-x86_64-linux-0.17.0.tar.xz

        # Add to PATH
        echo "$PWD/zig-x86_64-linux-0.17.0" >> $GITHUB_PATH

    - name: Verify Zig installation
      run: |
        zig version

    - name: Configure with zig cc
      run: |
        # Touch configure to prevent autogen re-runs
        touch configure aclocal.m4

        # Configure with zig cc
        CC="zig cc" ./configure \
          --without-x \
          --with-gnutls \
          --with-xml2 \
          --with-modules \
          --without-ns \
          --without-imagemagick \
          --without-dbus \
          --without-selinux \
          --with-tree-sitter \
          --with-native-compilation=no

    - name: Build Emacs with zig cc
      run: |
        # Full build (not just `src`): compiles all of lisp/ to .elc.
        # Required because we no longer vendor generated .elc (upstream doesn't
        # either); `make src` alone leaves lisp uncompiled, which breaks tests
        # that depend on compiled files / load-history (semantic, loadhist, ...).
        make -j$(nproc)

    - name: Verify build
      run: |
        src/emacs --version

    - name: Port tracker drift gate
      run: |
        # Fails if the ports detected in source (ZIGMACS_AB dispatchers / *.zig)
        # disagree with the classification map (scripts/port-categories.tsv) —
        # e.g. a new port landed without a map entry, or a .zig has no dispatcher.
        # Runs after the build so sibling .o files exist (used to scope the
        # "relevant/compiled" DEFUN surface). Keeps the progress table honest.
        python3 scripts/port-progress.py --check

    - name: Run test suite
      run: |
        cd test
        # Cap runtime so a flaky hanging test can't burn the 6h job limit.
        # Normal completion is ~3 min; 25 min is generous headroom.
        # '|| rc=$?' is required under 'bash -e': ordinary test failures make
        # `make check` exit nonzero (expected - the gate evaluates them), and
        # without this the step would die before the timeout check. Only a
        # timeout (rc 124) fails this step.
        rc=0
        timeout 1500 make check -j$(nproc) || rc=$?
        echo "make check exit rc=$rc"
        if [ "$rc" -eq 124 ]; then
          echo "::error::make check TIMED OUT (hanging test) - failing honestly, not masking"
          exit 1
        fi
        true

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: |
          test/**/*.log
          test/*.log
        if-no-files-found: warn

    - name: CI test gate
      if: always()
      run: |
        # Fast tier: uses allowlist-based gate (ci-gate.py) for per-PR speed.
        # Building the gcc oracle every PR would double build time.
        # The FULL results-equality gate (ci-gate-results-equality.py) runs
        # nightly in nightly.yml, which builds BOTH binaries and compares them.
        python3 scripts/ci-gate.py
